<!DOCTYPE html>
<html>

<head>
  <title>Ask Me</title>
  <link rel="stylesheet" href="style.css">
  <script src="scripts.js" defer></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="favicon.ico">
</head>

<body>

  <header>
    <a href="index.html" class="header-text">Ask Me</a>
  </header>

  <main>

    <div class="card border shadow">
      <h2>Ask me anything 👋</h2>
      <p>Write a question and get an answer from Sarvam AI.</p>
    </div>

    <form id="ask-form" class="ask-form">
      <label for="prompt">Your question</label>
      <textarea id="prompt" name="prompt" rows="4" maxlength="10000" placeholder="What would you like to know?" required></textarea>
      <button id="submit-button" type="submit">Get answer</button>
    </form>

    <p id="status" class="status" role="status" aria-live="polite"></p>
    <section id="answer" class="answer" aria-labelledby="answer-heading" hidden>
      <h2 id="answer-heading">Answer</h2>
      <p id="answer-text"></p>
    </section>

  </main>

  <footer>
    Made with <span class="heart">&hearts;</span> by me
  </footer>

</body>

</html>
